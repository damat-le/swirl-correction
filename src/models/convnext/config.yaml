data_params:
  in_dir: ./data/flower_photos

model_params:
  model_name: convnext_seq
  in_dim: 3
  out_dim: 3
  res_blocks: 3
  depths: [2, 2, 6, 2]
  dims: [64, 128, 256, 512]
  res_scale_init_value: 1.0e-6

opt_params:
  lr: 5.0e-3
  weight_decay: 1.0e-8

lr_scheduler_params:
  T_max: 200

trainer_params:
  device: 'cuda:1'
  batch_size: 32
  data_workers: 8
  epochs: 1000

log_params:
  log_dir: logs/ConvNextSeq
  seed: 42

val_params:
  val_size: 370
  batch_size: 64
  data_workers: 4
