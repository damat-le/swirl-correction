data_params:
  in_dir: ./data/flower_photos

model_params:
  model_name: posnet
  in_channels: 3 
  out_channels: 2
  num_blocks: 5

opt_params:
  lr: 0.0007

lr_scheduler_params:
  T_max: 350

trainer_params:
  device: 'cuda:1'
  batch_size: 32
  data_workers: 8
  epochs: 1000

log_params:
  log_dir: logs/PosNet
  seed: 42

val_params:
  val_size: 370
  batch_size: 64
  data_workers: 4
